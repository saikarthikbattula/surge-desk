name: Offline fixtures
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - run: python -m surgedesk.selftest
      - run: python -m surgedesk.research smoke --run-id ci-fixtures
      - run: python -m surgedesk.research_notebooks
